[project]
name = "cheapyscan"
version = "0.1.0"
description = "PC host application for the cheapyscan photogrammetry rig"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyserial>=3.5",
    "pillow>=10",
    "zipstream-ng>=1.7",
    "gphoto2>=2.5; sys_platform != 'win32'",
]

[project.scripts]
cheapyscan = "cheapyscan.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cheapyscan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
